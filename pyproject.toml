[project]
name = "benchflow"
version = "0.3.1"
description = "Multi-turn agent benchmarking with ACP — run any agent, any model, any provider."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["benchmark", "llm-agents", "acp", "agent-evaluation", "multi-turn", "terminal-bench", "skillsbench"]
dependencies = [
    # Test fork: paired harbor branch with the codex.py base-URL fix.
    # PyPI benchflow 0.3.1 pins harbor==0.3.0 (an older release), which
    # conflicts with installing the harbor 0.4.0-based fork separately.
    # Pinning to the fork URL here lets `pip install benchflow@<this-branch>`
    # bring both patched packages in a single resolve.
    "harbor @ git+https://github.com/Yiminnn/harbor.git@fix/707-codex-base-url-on-0.4.0",
    "httpx>=0.27.0",
    "anyio>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.9",
]
authors = [
    { name = "Xiangyi Li", email = "xiangyi@benchflow.ai" },
    { name = "Kyoung Whan Choe", email = "choe.kyoung@gmail.com" },
]

maintainers = [
    { name = "Xiangyi Li", email = "xiangyi@benchflow.ai" },
    { name = "Kyoung Whan Choe", email = "choe.kyoung@gmail.com" },
]

license = { text = "Apache-2.0" }

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "ty>=0.0.1a1",
]

[project.scripts]
benchflow = "benchflow.cli.main:app"
bench = "benchflow.cli.main:app"

[project.urls]
Homepage = "https://github.com/benchflow-ai/benchflow"
Repository = "https://github.com/benchflow-ai/benchflow"
Issues = "https://github.com/benchflow-ai/benchflow/issues"
Discord = "https://discord.gg/mZ9Rc8q8W3"
Changelog = "https://github.com/benchflow-ai/benchflow/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required because the harbor dep above is a direct VCS URL (test-fork
# pin). Hatchling refuses direct references in `project.dependencies`
# unless this is set.
allow-direct-references = true

[tool.hatch.build.targets.sdist]
# Allowlist: only ship what the installed package needs.
only-include = [
    "src",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
testpaths = ["tests"]
markers = [
    "live: requires real Anthropic API and Docker daemon (run with -m live)",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long — ruff format handles wrapping; long lines are intentional
    "RUF002", # ambiguous unicode in docstrings — × is intentional for "agent × model" matrix
    "RUF022", # __all__ unsorted — grouped by section for agent-friendliness
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src"]
